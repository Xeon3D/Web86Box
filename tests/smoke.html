<!doctype html>
<meta charset="utf-8">
<title>Web86Box smoke test</title>
<canvas id="screen" width="640" height="480" style="image-rendering:pixelated;background:#000"></canvas>
<pre id="log"></pre>
<script type="module">
// Boots a VM described by ?cfg=<urlencoded INI> (default: IBM PC/AT-ish).
import { Emulator } from './js/emulator.js';
import * as storage from './js/storage.js';
const params = new URLSearchParams(location.search);
const cfg = params.get('cfg') || '[Machine]\nmachine = ibmat\ncpu_family = ibmat\ncpu_speed = 6000000\nmem_size = 640\n\n[Video]\ngfxcard = vga\n';
window.events = [];
const emu = new Emulator({ canvas: document.getElementById('screen') });
window.emu = emu;
for (const t of ['state','catalog','resize','title','msgbox','error','hard_reset','speed','mouse_capture','sb_update'])
  emu.addEventListener(t, (e) => { window.events.push([t, t === 'catalog' ? '(catalog)' : e.detail]);
    if (t === 'msgbox') emu.msgboxReply(e.detail.id, 1); });
await storage.createVM('smoke', cfg);
await emu.load();
emu.start(storage.vmPath('smoke'));
window.started = true;
</script>
